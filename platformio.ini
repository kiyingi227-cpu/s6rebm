; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_ota.csv
build_flags =
    -DONYX_FW_MAJOR=1
    -DONYX_FW_MINOR=0
    -DONYX_FW_PATCH=7
    -DONYX_PRODUCT_ID=0x0601
    -DONYX_HW_REV=1
build_src_filter = +<*> -<power_off_probe.cpp> -<sysid_capture.cpp>
monitor_speed = 115200
upload_speed = 460800

[env:sysid_capture]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<*> -<main.cpp> -<bt_audio.cpp> -<bt_ota.cpp> -<power_off_probe.cpp>
monitor_speed = 115200
upload_speed = 460800

[env:power_off_probe]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<power_off_probe.cpp>
monitor_speed = 115200
upload_speed = 460800
